service: book-catalog

build:
  esbuild: false

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-2
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Scan
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Books

plugins:
  - serverless-plugin-typescript
  - serverless-offline  

functions:
  ${file(src/4 framework/functions/handlers.yml)}